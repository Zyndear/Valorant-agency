<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ValoAgence">
<meta name="theme-color" content="#0f0f0f">
<title>ValoAgence IA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:rgba(255,255,255,0.08);--text:#f0f0f0;--muted:#888;--accent:#ff4655;--green:#00d4aa;--warn:#f0a500;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:100px;}
  header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;}
  .logo span{color:var(--accent);}
  .badge{font-size:11px;background:rgba(255,70,85,0.15);color:var(--accent);border:1px solid rgba(255,70,85,0.3);padding:3px 8px;border-radius:20px;}
  .key-section{margin:16px 20px 12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .key-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;}
  .key-toggle span{font-size:13px;color:var(--muted);}
  .key-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);}
  .key-body.open{display:block;}
  .key-body label{display:block;font-size:11px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px;}
  .key-body input,.key-body textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;}
  .key-body textarea{resize:vertical;min-height:90px;line-height:1.5;}
  .key-body input:focus,.key-body textarea:focus{outline:1px solid var(--accent);}
  .key-hint{font-size:11px;color:var(--muted);margin-top:4px;}
  .key-hint a{color:var(--accent);}
  .save-btn{margin-top:10px;width:100%;padding:10px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Syne',sans-serif;}
  .test-btn{margin-top:6px;width:100%;padding:10px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .input-wrap{margin:0 20px 12px;}
  .input-wrap textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;resize:none;height:70px;line-height:1.5;}
  .input-wrap textarea:focus{outline:1px solid var(--accent);}
  .input-wrap textarea::placeholder{color:var(--muted);}
  .run-all{margin:0 20px 20px;display:block;width:calc(100% - 40px);padding:14px;background:var(--accent);color:white;border:none;border-radius:12px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;}
  .run-all:disabled{opacity:.4;cursor:not-allowed;}
  .section-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:0 20px;margin-bottom:10px;font-family:'Syne',sans-serif;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;}
  @media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s;}
  .card.running{border-color:var(--warn);}
  .card.done{border-color:var(--green);}
  .card.error{border-color:var(--accent);}
  .card-head{display:flex;align-items:center;gap:8px;}
  .card-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .card-name{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
  .card-model{font-size:10px;color:var(--muted);}
  .card-status{font-size:10px;min-height:14px;}
  .card-status.running{color:var(--warn);}
  .card-status.done{color:var(--green);}
  .card-status.error{color:var(--accent);}
  .card-output{font-size:12px;line-height:1.6;color:#ccc;background:var(--surface2);border-radius:8px;padding:10px;display:none;max-height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;}
  .card-output.visible{display:block;}
  .card-img{border-radius:8px;width:100%;display:none;}
  .card-img.visible{display:block;}
  .style-tabs{display:flex;gap:5px;flex-wrap:wrap;}
  .style-tab{font-size:11px;padding:4px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;}
  .style-tab.active{border-color:var(--accent);color:var(--accent);}
  .img-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .img-nav button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 10px;cursor:pointer;}
  .card-foot{display:flex;gap:6px;}
  .btn-run{flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .btn-run:hover{border-color:var(--accent);color:var(--accent);}
  .btn-run:disabled{opacity:.4;cursor:not-allowed;}
  .btn-copy{padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;display:none;}
  .btn-copy.visible{display:block;}
  .install-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;font-size:12px;color:var(--muted);text-align:center;display:none;}
  .install-bar.show{display:block;}
</style>
</head>
<body>

<header>
  <div class="logo">Valo<span>Agence</span></div>
  <div class="badge">7 agents IA</div>
</header>

<div class="key-section">
  <div class="key-toggle" onclick="this.nextElementSibling.classList.toggle('open')">
    <span>⚙ Réglages (clé API + contexte chaîne)</span><span>▾</span>
  </div>
  <div class="key-body">
    <label>Clé Groq — une seule clé pour tous les agents</label>
    <input type="password" id="groq-key" placeholder="gsk_..." />
    <div class="key-hint">Gratuit sur <a href="https://console.groq.com" target="_blank">console.groq.com</a></div>
    <button class="save-btn" onclick="saveKey()">Enregistrer la clé</button>
    <button class="test-btn" id="test-btn" onclick="testKey()">Tester la clé</button>

    <label>Contexte de ta chaîne (lu par tous les agents)</label>
    <textarea id="channel-ctx"></textarea>
    <div class="key-hint">Mets à jour ton nombre d'abonnés, tes stats et tes objectifs : les agents s'adaptent.</div>
    <button class="save-btn" onclick="saveCtx()">Enregistrer le contexte</button>
  </div>
</div>

<div class="input-wrap">
  <textarea id="sujet" placeholder="Sujet de ta vidéo (ex: les erreurs de visée en ranked)"></textarea>
</div>

<button class="run-all" id="run-all-btn" onclick="runAll()">⚡ Lancer tous les agents</button>

<div class="section-label">Agents</div>
<div class="grid" id="grid"></div>

<div class="install-bar" id="install-bar">
  📱 Safari → Partager → "Sur l'écran d'accueil" pour installer
</div>

<script>
const DEFAULT_CTX = "Chaîne YouTube francophone sur Valorant, pour les débutants qui veulent progresser en ranked en comprenant leurs erreurs. Chaîne en démarrage (environ 50 abonnés). Objectif : devenir une chaîne professionnelle, avec une audience fidèle, une identité reconnaissable, une régularité de publication et des revenus (partenariats, sponsoring, monétisation). Série de vidéos tutoriels déjà filmée, en cours de montage et de publication.";

const SYSTEM_BASE = "Tu es un membre d'une agence de croissance YouTube spécialisée dans le gaming francophone. Tu travailles pour le créateur d'une chaîne dont l'objectif est de devenir professionnelle. Tu raisonnes comme un professionnel : tu fixes des priorités, tu donnes des actions concrètes et mesurables, tu pars de la réalité de la chaîne (taille actuelle de l'audience) et tu construis une progression par paliers plutôt que de promettre des résultats irréalistes. Tu évites le blabla et les généralités. Tu réponds toujours en français, de façon structurée et directe. Tu ne prétends pas disposer de données en temps réel : quand tu cites des chiffres, ce sont des ordres de grandeur ou des hypothèses, et tu le précises.";

const AGENTS = [
  {
    id: "recherche", name: "Stratège", model: "GPT-OSS 120B", icon: "🔍", bg: "#1e3a5f",
    groq_model: "openai/gpt-oss-120b", max_tokens: 4000,
    role: "Tu es le stratège contenu et analyste d'audience de l'agence.",
    prompt: s => `Sujet de la prochaine vidéo : "${s}".

Livre une note stratégique :

1. DEMANDE RÉELLE : ce que les débutants Valorant cherchent vraiment sur ce sujet (intentions de recherche, questions précises, frustrations)
2. POSITIONNEMENT : ce que font déjà les gros créateurs sur ce sujet, et l'angle qui permet à une petite chaîne de se démarquer
3. TOP 5 ERREURS DÉBUTANTS liées au sujet : pour chacune, pourquoi elle est fréquente et le bon réflexe
4. PROMESSE DE LA VIDÉO : une phrase claire (ce que le spectateur saura faire après)
5. HOOK ÉMOTIONNEL : l'émotion à activer et pourquoi
6. MOTS-CLÉS : 8 requêtes que les débutants tapent réellement
7. RISQUES : ce qui pourrait faire flopper cette vidéo et comment l'éviter`
  },
  {
    id: "script", name: "Scénariste", model: "GPT-OSS 120B", icon: "📝", bg: "#1a3d2e",
    groq_model: "openai/gpt-oss-120b", max_tokens: 4000,
    role: "Tu es le scénariste en chef, expert en rétention d'audience et en storytelling pédagogique.",
    prompt: s => `Sujet de la vidéo : "${s}".

Propose 3 AXES NARRATIFS différents. Pour chaque axe, donne :
- Le concept en une phrase et le titre de travail
- L'ACCROCHE écrite mot pour mot (les 15 premières secondes)
- Le plan en 5 à 7 séquences avec la durée de chacune
- Les points de relance de l'attention (pattern interrupts, teasing, open loops) placés dans le plan
- Le moment de la démonstration ou preuve (gameplay, exemple, avant/après)
- La conclusion et l'appel à l'action (abonnement + vidéo suivante)
- Le niveau de risque et le potentiel de rétention (faible / moyen / fort) avec une justification

Termine par ta RECOMMANDATION : quel axe choisir pour cette étape de la chaîne et pourquoi.`
  },
  {
    id: "seo", name: "Titre & SEO", model: "GPT-OSS 20B", icon: "📈", bg: "#3d2a0a",
    groq_model: "openai/gpt-oss-20b", max_tokens: 3000,
    role: "Tu es l'expert packaging et SEO YouTube de l'agence.",
    prompt: s => `Sujet de la vidéo : "${s}".

Livre :
1. TITRES : 5 titres (60 caractères max) répartis en 5 angles : curiosité, erreur à éviter, résultat promis, chiffre/liste, émotion. Indique pour chacun le point fort et le risque (clickbait ou flou).
2. TITRE RECOMMANDÉ et pourquoi
3. DESCRIPTION : 2 premières lignes très accrocheuses (visibles avant « afficher plus »), puis un corps de description avec mots-clés naturels, chapitres horodatés à compléter, liens et appel à l'action
4. TAGS : 15 tags du plus précis au plus large
5. PACKAGING : cohérence titre + miniature (le titre ne doit pas répéter le texte de la miniature)
6. ÉPINGLER : un commentaire à épingler qui relance l'engagement
7. SHORTS : 3 idées de Shorts à extraire de cette vidéo`
  },
  {
    id: "miniature", name: "Miniature", model: "Pollinations.ai", icon: "🎨", bg: "#3d1a2e",
    groq_model: null, styleIdx: 0,
    styles: [
      { label: "🔥 Choc",  prompt: s => `YouTube thumbnail, Valorant beginner mistake ${s}, extreme shocked face close-up, large red warning sign, neon red and black lighting, high contrast, bold white text, strong focal point` },
      { label: "💡 Tuto",  prompt: s => `YouTube tutorial thumbnail, Valorant ${s}, clean before and after split, blue and orange contrast, upward arrow, bright flat design, one large word of text` },
      { label: "😤 Rage",  prompt: s => `YouTube thumbnail, Valorant rank fail ${s}, exaggerated frustrated gamer face, flames, broken keyboard, comic style, orange red yellow contrast, bold thick text` },
      { label: "🎯 Pro",   prompt: s => `YouTube premium thumbnail, Valorant ${s}, cinematic dark scene, agent silhouette, glowing crosshair, gold rank emblem, minimal typography, dramatic spotlight, esports quality` }
    ]
  },
  {
    id: "coaching", name: "Coach Valo", model: "GPT-OSS 120B", icon: "🧠", bg: "#2a1a1a",
    groq_model: "openai/gpt-oss-120b", max_tokens: 4000,
    role: "Tu es coach Valorant expert, doublé d'un préparateur mental spécialisé en esport. Tu as coaché des joueurs de Bronze à Diamant.",
    prompt: s => `Sujet de la vidéo : "${s}".

Livre le contenu de coaching qui rend la vidéo vraiment utile :

VOLET 1 — CORRECTION TECHNIQUE
Pour chaque erreur liée au sujet : l'erreur exacte, sa cause (habitude, réflexe, mauvaise information), un exercice concret avec durée et fréquence, et un critère simple pour mesurer le progrès. Ajoute un exercice à faire en mode entraînement ou en partie personnalisée.

VOLET 2 — MENTAL
- Le piège mental associé à ce sujet (tilt, ego, impatience, peur de perdre des points)
- Une technique de reset utilisable en pleine partie (30 secondes maximum)
- Une routine avant la partie
- Un état d'esprit à adopter, formulé simplement

VOLET 3 — PLAN SUR 7 JOURS
Un mini programme jour par jour que le spectateur peut suivre (15 à 30 minutes par jour).

BONUS CRÉATEUR : comment mettre ce coaching en scène à l'écran pour que le spectateur sente une progression, et quel défi proposer en commentaire pour créer de l'engagement.`
  },
  {
    id: "planning", name: "Planning", model: "GPT-OSS 20B", icon: "📅", bg: "#1a3320",
    groq_model: "openai/gpt-oss-20b", max_tokens: 3000,
    role: "Tu es le directeur de chaîne : tu construis la roadmap de croissance et la ligne éditoriale.",
    prompt: s => `Vidéo en cours : "${s}".

Livre un plan de chaîne :

1. IDENTITÉ : promesse de la chaîne en une phrase, public cible, ton, 3 piliers de contenu, nom de la série et structure récurrente (intro, rubrique, outro) pour être reconnaissable
2. CALENDRIER 6 SEMAINES : pour chaque semaine, vidéo longue (sujet, titre de travail, rôle dans la série) et 2 Shorts
3. RÉGULARITÉ : rythme de publication réaliste pour un créateur seul avec un travail à côté
4. SÉRIE : comment relier les vidéos entre elles (teasing, fin de vidéo qui renvoie vers la suivante, playlist)
5. ROADMAP PAR PALIERS : 0 à 100 abonnés, 100 à 1000, 1000 à 4000 heures de visionnage (conditions de monétisation) : objectifs et priorités de chaque palier
6. INDICATEURS À SUIVRE : CTR, rétention moyenne, abonnés gagnés par vidéo, et à partir de quelles valeurs agir
7. ERREURS À ÉVITER à cette étape`
  },
  {
    id: "partenariat", name: "Partenariat", model: "GPT-OSS 120B", icon: "🤝", bg: "#2a1a3d",
    groq_model: "openai/gpt-oss-120b", max_tokens: 4000,
    role: "Tu es le responsable partenariats et monétisation de l'agence, spécialisé dans les créateurs gaming.",
    prompt: s => `Vidéo en cours : "${s}".

Livre un plan de monétisation et de partenariats réaliste pour cette étape de la chaîne :

1. SOURCES DE REVENUS : classe par ordre de priorité (programme YouTube, affiliation, codes promo, sponsoring, coaching, produits), avec ce qui est accessible dès maintenant et ce qui demande plus d'audience
2. MARQUES À CONTACTER : 6 marques ou services pertinents pour une audience de joueurs Valorant débutants, avec le type de deal adapté à une petite chaîne (affiliation, produit contre contenu, code promo)
3. EMAIL DE PROSPECTION (180 mots max) : objet + corps, sans exagérer les chiffres, avec une proposition de valeur claire
4. RELANCE : un message de relance à envoyer 7 jours après
5. DOSSIER DE PRÉSENTATION : les 6 éléments à mettre dans un media kit simple
6. NÉGOCIATION : ce qu'il faut demander et ce qu'il faut refuser
7. ÉTAPES : ce qu'il faut atteindre (abonnés, vues, engagement) avant de viser des sponsors plus importants`
  }
];

function saveKey() {
  const val = document.getElementById("groq-key").value.replace(/\s+/g, "").trim();
  if (!val) return;
  localStorage.setItem("groq_key", val);
  const btn = document.querySelectorAll(".save-btn")[0];
  btn.textContent = "✓ Enregistrée (" + val.length + " caractères)";
  setTimeout(() => btn.textContent = "Enregistrer la clé", 3000);
}

function saveCtx() {
  const val = document.getElementById("channel-ctx").value.trim();
  localStorage.setItem("channel_ctx", val || DEFAULT_CTX);
  const btn = document.querySelectorAll(".save-btn")[1];
  btn.textContent = "✓ Contexte enregistré";
  setTimeout(() => btn.textContent = "Enregistrer le contexte", 2500);
}

function getCtx() {
  return localStorage.getItem("channel_ctx") || DEFAULT_CTX;
}

function loadSettings() {
  document.getElementById("groq-key").value = localStorage.getItem("groq_key") || "";
  document.getElementById("channel-ctx").value = getCtx();
}

async function testKey() {
  const key = localStorage.getItem("groq_key");
  const btn = document.getElementById("test-btn");
  if (!key) { btn.textContent = "❌ Aucune clé enregistrée"; return; }
  btn.textContent = "Test en cours...";
  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key.replace(/\s+/g,"").trim() },
      body: JSON.stringify({ model: "openai/gpt-oss-20b", messages: [{ role: "user", content: "Réponds OK" }], max_completion_tokens: 300, reasoning_effort: "low", include_reasoning: false })
    });
    const d = await res.json();
    btn.textContent = res.ok ? "✅ Clé valide !" : "❌ " + (d.error?.message || "Clé invalide");
  } catch(e) {
    btn.textContent = "❌ " + e.message;
  }
  setTimeout(() => btn.textContent = "Tester la clé", 4000);
}

async function callGroq(agent, sujet, attempt) {
  attempt = attempt || 0;
  const key = localStorage.getItem("groq_key");
  if (!key) throw new Error("Clé Groq manquante — configure-la dans Réglages");
  const cleanKey = key.replace(/\s+/g, "").trim();
  const system = SYSTEM_BASE + " " + agent.role + "\n\nContexte de la chaîne : " + getCtx();
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 60000);
  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cleanKey },
      body: JSON.stringify({
        model: agent.groq_model,
        messages: [
          { role: "system", content: system },
          { role: "user", content: agent.prompt(sujet) }
        ],
        max_completion_tokens: agent.max_tokens || 3000,
        reasoning_effort: "low",
        include_reasoning: false,
        temperature: 0.7
      })
    });
    clearTimeout(timeout);
    const data = await res.json();
    if (res.status === 429 && attempt < 2) {
      await new Promise(r => setTimeout(r, 8000 * (attempt + 1)));
      return callGroq(agent, sujet, attempt + 1);
    }
    if (!res.ok) throw new Error(data.error?.message || "Erreur API " + res.status);
    const txt = data.choices?.[0]?.message?.content;
    if (!txt || !txt.trim()) throw new Error("Réponse vide — relance l'agent");
    return txt;
  } catch(e) {
    clearTimeout(timeout);
    if (e.name === "AbortError") throw new Error("Timeout — réessaie");
    throw e;
  }
}

async function generateMiniature(agent, sujet, idx) {
  const img = document.getElementById("img-miniature");
  const nav = document.getElementById("nav-miniature");
  const navLabel = document.getElementById("nav-label-miniature");
  const style = agent.styles[idx];
  img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(style.prompt(sujet)) + "?width=640&height=360&nologo=true&seed=" + Date.now();
  img.classList.add("visible");
  if (nav) nav.style.display = "flex";
  if (navLabel) navLabel.textContent = style.label;
  await new Promise((res, rej) => {
    img.onload = () => res();
    img.onerror = () => rej(new Error("Échec image"));
    setTimeout(() => rej(new Error("Timeout image")), 30000);
  });
}

function buildStyleTabs(agent) {
  const container = document.getElementById("styles-miniature");
  if (!container) return;
  container.innerHTML = agent.styles.map((s, i) =>
    `<button class="style-tab ${i === (agent.styleIdx||0) ? 'active' : ''}" onclick="selectStyle(${i})">${s.label}</button>`
  ).join("");
}

async function selectStyle(idx) {
  const agent = AGENTS.find(a => a.id === "miniature");
  agent.styleIdx = idx;
  buildStyleTabs(agent);
  const sujet = document.getElementById("sujet").value.trim();
  if (!sujet) return;
  const card = document.getElementById("card-miniature");
  const status = document.getElementById("status-miniature");
  card.className = "card running";
  status.textContent = "En cours...";
  status.className = "card-status running";
  try {
    await generateMiniature(agent, sujet, idx);
    card.className = "card done";
    status.textContent = "✓ Image générée";
    status.className = "card-status done";
  } catch(e) {
    card.className = "card error";
    status.textContent = "❌ " + e.message;
    status.className = "card-status error";
  }
}

function prevStyle() {
  const agent = AGENTS.find(a => a.id === "miniature");
  selectStyle(((agent.styleIdx||0) - 1 + agent.styles.length) % agent.styles.length);
}
function nextStyle() {
  const agent = AGENTS.find(a => a.id === "miniature");
  selectStyle(((agent.styleIdx||0) + 1) % agent.styles.length);
}

function buildGrid() {
  document.getElementById("grid").innerHTML = AGENTS.map(a => `
    <div class="card" id="card-${a.id}">
      <div class="card-head">
        <div class="card-icon" style="background:${a.bg}">${a.icon}</div>
        <div>
          <div class="card-name">${a.name}</div>
          <div class="card-model">${a.model}</div>
        </div>
      </div>
      <div class="card-status" id="status-${a.id}"></div>
      ${a.id === 'miniature' ? `
        <div class="style-tabs" id="styles-miniature"></div>
        <img class="card-img" id="img-miniature" alt="miniature" />
        <div class="img-nav" id="nav-miniature" style="display:none">
          <button onclick="prevStyle()">◀</button>
          <span id="nav-label-miniature" style="font-size:11px;color:var(--muted)"></span>
          <button onclick="nextStyle()">▶</button>
        </div>
      ` : `<div class="card-output" id="out-${a.id}"></div>`}
      <div class="card-foot">
        <button class="btn-run" id="btn-${a.id}" onclick="runAgent('${a.id}')">Lancer</button>
        ${a.id !== 'miniature' ? `<button class="btn-copy" id="copy-${a.id}" onclick="copyOut('${a.id}')">📋</button>` : ''}
      </div>
    </div>
  `).join("");
}

async function runAgent(id) {
  const sujet = document.getElementById("sujet").value.trim();
  if (!sujet) { alert("Entre un sujet d'abord."); return; }
  const agent = AGENTS.find(a => a.id === id);
  const card   = document.getElementById("card-" + id);
  const out    = document.getElementById("out-" + id);
  const status = document.getElementById("status-" + id);
  const btn    = document.getElementById("btn-" + id);
  const copy   = document.getElementById("copy-" + id);

  card.className = "card running";
  status.textContent = "En cours...";
  status.className = "card-status running";
  if (out) { out.textContent = ""; out.classList.remove("visible"); }
  if (copy) copy.classList.remove("visible");
  btn.disabled = true;

  try {
    if (agent.groq_model === null) {
      await generateMiniature(agent, sujet, agent.styleIdx || 0);
      card.className = "card done";
      status.textContent = "✓ Image générée";
      status.className = "card-status done";
    } else {
      const result = await callGroq(agent, sujet);
      if (out) { out.textContent = result; out.classList.add("visible"); }
      if (copy) copy.classList.add("visible");
      card.className = "card done";
      status.textContent = "✓ Terminé";
      status.className = "card-status done";
    }
  } catch(e) {
    if (out) { out.textContent = "❌ " + e.message; out.classList.add("visible"); }
    status.textContent = "❌ " + e.message;
    status.className = "card-status error";
    card.className = "card error";
  }
  btn.disabled = false;
}

async function runAll() {
  const sujet = document.getElementById("sujet").value.trim();
  if (!sujet) { alert("Entre un sujet d'abord."); return; }
  const btn = document.getElementById("run-all-btn");
  btn.disabled = true;
  btn.textContent = "Agents en cours...";
  const jobs = [];
  for (const a of AGENTS) { jobs.push(runAgent(a.id)); await new Promise(r => setTimeout(r, 400)); }
  await Promise.all(jobs);
  btn.disabled = false;
  btn.textContent = "⚡ Lancer tous les agents";
}

function copyOut(id) {
  const text = document.getElementById("out-" + id)?.textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copy-" + id);
    btn.textContent = "✓";
    setTimeout(() => btn.textContent = "📋", 2000);
  });
}

buildGrid();
loadSettings();
buildStyleTabs(AGENTS.find(a => a.id === "miniature"));
if (/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone) {
  document.getElementById("install-bar").classList.add("show");
}
</script>
